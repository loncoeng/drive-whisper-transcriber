name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token this job is given. Without this block it gets the repository's
# default, which is wider than anything here needs: nothing writes back to the
# repository, and a step that is compromised should not be able to.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # publish-guard reads the whole history; a shallow clone
          # would make the check meaningless.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall -q vm_drive_whisper.py drive_folder_inventory.py

      # Nothing is installed. The tests cover the pure functions only, and
      # faster-whisper and google-api-python-client are replaced with stubs.
      - name: Unit tests
        run: python -m unittest discover -s tests -t tests -v

      - name: Shell script syntax
        run: |
          for f in scripts/setup_swap.sh scripts/*.example; do
            echo "checking $f"
            bash -n "$f"
          done

      # Narrowed to severity=error. Letting style and warning through turns
      # it red over things that are written that way on purpose — a source
      # whose target cannot be resolved, for one.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=bash --severity=error scripts/setup_swap.sh scripts/*.example

      # The shop this was rebuilt from must not be identifiable from what is
      # published here — including from the history, which a force-push does
      # not clean. publish-guard reads every blob on every ref.
      #
      # The terms arrive from a secret rather than a committed file: writing
      # them down in order to forbid them would publish them.
      #
      # An unset secret warns and passes. Failing on a missing secret trains
      # people to ignore the check; passing in silence is worse than having none.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Nothing identifying in the history
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          if [ -z "${FORBIDDEN_TERMS}" ]; then
            echo "::warning::FORBIDDEN_TERMS is not set — the history was not checked."
            exit 0
          fi
          python -m pip install --quiet publish-guard
          python - <<'PY' > publish-guard.generated.toml
          import json, os
          terms = [t.strip() for t in os.environ["FORBIDDEN_TERMS"].splitlines() if t.strip()]
          print("[forbidden]")
          print("terms = [")
          for t in terms:
              # json.dumps escapes quotes and backslashes the way a TOML basic
              # string needs. repr() with the quotes swapped looks like it does
              # and breaks on the first term carrying either.
              print("  " + json.dumps(t, ensure_ascii=False) + ",")
          print("]")
          PY
          publish-guard verify . --config publish-guard.generated.toml
          rm -f publish-guard.generated.toml
